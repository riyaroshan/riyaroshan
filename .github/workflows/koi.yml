
name: Generate Git Koi

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/koi.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: asagi

      - name: Commit koi
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add koi/koi.gif
          git diff --cached --quiet || git commit -m "Update Git Koi"
          git push
